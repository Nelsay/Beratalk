name: BeraTalk Build R11 — GUIDED DAILY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm BeraTalk workflow revision
        shell: bash
        run: |
          set -euo pipefail
          echo "BeraTalk workflow revision: 2026-09-09-R11"
          echo "Expected package: com.beratalk.app"
          echo "Expected app: 1.4.0-guided / versionCode 8"
          echo "Required source: BeraTalk-AI-Spark-LIVE-UI-R11-source.zip"

      - name: Locate BeraTalk Android project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          is_project() {
            local dir="$1"
            [[ -f "$dir/app/build.gradle.kts" ]] || return 1
            grep -q 'applicationId = "com.beratalk.app"' "$dir/app/build.gradle.kts"
          }

          PROJECT_DIR=""
          PREFERRED="$GITHUB_WORKSPACE/BeraTalk-AI-Spark-LIVE-UI-R11-source.zip"
          if [[ ! -f "$PREFERRED" ]]; then
            echo "ERROR: Required R11 source ZIP is missing: $(basename "$PREFERRED")"
            exit 1
          fi

          EXTRACT_ROOT="$GITHUB_WORKSPACE/ci-beratalk-r11"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          unzip -q "$PREFERRED" -d "$EXTRACT_ROOT"

          while IFS= read -r settings; do
            candidate="$(cd "$(dirname "$settings")" && pwd)"
            if is_project "$candidate"; then PROJECT_DIR="$candidate"; break; fi
          done < <(find "$EXTRACT_ROOT" -maxdepth 9 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print | sort)

          [[ -n "$PROJECT_DIR" ]] || { echo "ERROR: Android project not found in R11 archive."; exit 1; }
          test -s "$PROJECT_DIR/app/google-services.json" || { echo "ERROR: app/google-services.json missing."; exit 1; }
          test -s "$PROJECT_DIR/signing/beratalk-release.jks" || { echo "ERROR: release keystore missing."; exit 1; }
          test -s "$PROJECT_DIR/signing/keystore.properties" || { echo "ERROR: signing properties missing."; exit 1; }
          grep -q '"package_name": "com.beratalk.app"' "$PROJECT_DIR/app/google-services.json" || { echo "ERROR: wrong Firebase Android package."; exit 1; }
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"

      - name: Verify AGP 9 and API 37 source
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          ROOT_BUILD="$PROJECT_DIR/build.gradle.kts"
          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"
          PROPS="$PROJECT_DIR/gradle.properties"
          ! grep -q '^android.builtInKotlin=false$' "$PROPS" || { echo "ERROR: AGP built-in Kotlin disabled."; exit 1; }
          ! grep -q '^android.newDsl=false$' "$PROPS" || { echo "ERROR: legacy AGP DSL enabled."; exit 1; }
          ! grep -q 'org.jetbrains.kotlin.android' "$ROOT_BUILD" || { echo "ERROR: legacy Kotlin Android plugin in root build."; exit 1; }
          ! grep -q 'org.jetbrains.kotlin.android' "$APP_BUILD" || { echo "ERROR: legacy Kotlin Android plugin in app build."; exit 1; }
          ! grep -q 'kotlinOptions' "$APP_BUILD" || { echo "ERROR: deprecated kotlinOptions remains."; exit 1; }
          grep -q 'com.android.application") version "9.4.0"' "$ROOT_BUILD" || { echo "ERROR: Expected AGP 9.4.0."; exit 1; }
          grep -q 'org.jetbrains.kotlin.plugin.compose") version "2.3.21"' "$ROOT_BUILD" || { echo "ERROR: Expected Compose plugin 2.3.21."; exit 1; }
          grep -q 'compileSdk = 37' "$APP_BUILD" || { echo "ERROR: compileSdk must be 37."; exit 1; }
          grep -q 'targetSdk = 36' "$APP_BUILD" || { echo "ERROR: targetSdk must remain 36."; exit 1; }
          grep -q 'versionCode = 8' "$APP_BUILD" || { echo "ERROR: Expected versionCode 8."; exit 1; }
          grep -q 'versionName = "1.4.0-guided"' "$APP_BUILD" || { echo "ERROR: Expected versionName 1.4.0-guided."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 37.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Verify R11 guided runtime
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/beratalk/app/MainActivity.kt"
          UI="$PROJECT_DIR/app/src/main/java/com/beratalk/app/R11Screens.kt"
          CATALOG="$PROJECT_DIR/app/src/main/java/com/beratalk/app/data/CurriculumCatalog.kt"
          AI="$PROJECT_DIR/app/src/main/java/com/beratalk/app/data/AiClients.kt"
          GATEWAY="$PROJECT_DIR/app/src/main/java/com/beratalk/app/data/FirebaseGateway.kt"
          MODELS="$PROJECT_DIR/app/src/main/java/com/beratalk/app/model/Models.kt"
          NOTIFY="$PROJECT_DIR/app/src/main/java/com/beratalk/app/notifications/BeraNotifications.kt"
          THEME="$PROJECT_DIR/app/src/main/java/com/beratalk/app/ui/theme/Theme.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          RULES="$PROJECT_DIR/firebase/firestore.rules"

          # Product structure.
          grep -q 'val tabs = listOf(Tab.HOME, Tab.CHAT, Tab.LEARN, Tab.LIBRARY)' "$UI" || { echo "ERROR: four-tab nav missing."; exit 1; }
          grep -q 'if (tab != Tab.CHAT && tab != Tab.US)' "$MAIN" || { echo "ERROR: immersive Chat nav hiding missing."; exit 1; }
          grep -q 'BackHandler(enabled = showSettings || showGame || tab != Tab.HOME)' "$MAIN" || { echo "ERROR: internal Back handling missing."; exit 1; }
          grep -q 'onConversation = { navigate(Tab.CHAT) }' "$MAIN" || { echo "ERROR: Home daily conversation must open Chat."; exit 1; }
          grep -q 'onSendText = { text, dailyLineId ->' "$MAIN" || { echo "ERROR: tagged daily text chat missing."; exit 1; }
          grep -q 'onSendVoice = { file, duration, correctionFor, dailyLineId ->' "$MAIN" || { echo "ERROR: tagged daily voice chat missing."; exit 1; }
          grep -q 'What are we doing today?' "$UI" || { echo "ERROR: daily Chat sidekick missing."; exit 1; }
          grep -q 'activeDailyLineId' "$UI" || { echo "ERROR: daily line selection missing."; exit 1; }
          grep -q 'mutableStateListOf<String>()' "$UI" || { echo "ERROR: Chat multi-selection missing."; exit 1; }
          grep -q 'deleteChatMessages' "$GATEWAY" || { echo "ERROR: Chat curation delete missing."; exit 1; }
          grep -q 'R11QuickGameScreen' "$UI" || { echo "ERROR: Home quick-review game missing."; exit 1; }

          # Guided language-bank progression.
          grep -q 'WORD("Words", 50)' "$MODELS" || { echo "ERROR: 50-word threshold missing."; exit 1; }
          grep -q 'SENTENCE("Sentences", 25)' "$MODELS" || { echo "ERROR: 25-sentence threshold missing."; exit 1; }
          grep -q 'CONVERSATION("Conversations", 10)' "$MODELS" || { echo "ERROR: 10-conversation threshold missing."; exit 1; }
          grep -q 'STORY("Stories", 3)' "$MODELS" || { echo "ERROR: 3-story threshold missing."; exit 1; }
          grep -q 'requiredLanguages.all' "$CATALOG" || { echo "ERROR: paired-language threshold balance missing."; exit 1; }
          grep -q 'fun dailyBankTask' "$CATALOG" || { echo "ERROR: guided daily bank assignments missing."; exit 1; }
          grep -q 'Everyday & survival' "$MODELS" || { echo "ERROR: category progression missing."; exit 1; }
          grep -q 'Finish .* to unlock' "$UI" || { echo "ERROR: next-category lock state missing."; exit 1; }
          grep -q 'Replace voice' "$UI" || { echo "ERROR: editable bank voice missing."; exit 1; }
          grep -q 'Save changes' "$UI" || { echo "ERROR: editable bank spelling missing."; exit 1; }

          # AI owns the English conversation structure; humans own target-language wording.
          grep -q 'buildDailyConversation' "$AI" || { echo "ERROR: AI daily planner missing."; exit 1; }
          grep -q 'conversation structure in English only' "$AI" || { echo "ERROR: English-only AI curriculum boundary missing."; exit 1; }
          grep -q 'Do not translate the lines into the target language' "$AI" || { echo "ERROR: human-language contribution boundary missing."; exit 1; }
          grep -q 'getOrCreateDailyConversation' "$GATEWAY" || { echo "ERROR: shared daily plan persistence missing."; exit 1; }

          # Settings / theme / pairing.
          grep -q 'Regenerate' "$UI" || { echo "ERROR: pair-code regeneration missing."; exit 1; }
          grep -q 'updateLanguages' "$GATEWAY" || { echo "ERROR: language switching missing."; exit 1; }
          grep -q 'Dark mode' "$UI" || { echo "ERROR: dark mode control missing."; exit 1; }
          grep -q 'Color(0xFF111112) else Color.White' "$THEME" || { echo "ERROR: dark/pure-white canvas tokens missing."; exit 1; }
          grep -q 'val ActionColor: Color @Composable get() = if (LocalBeraDarkMode.current) Color.White else Color.Black' "$THEME" || { echo "ERROR: black light-mode action color missing."; exit 1; }

          # Notifications and Firebase permissions.
          grep -q 'FirebaseMessagingService' "$NOTIFY" || { echo "ERROR: FCM receiver missing."; exit 1; }
          grep -q 'DailyReminderReceiver' "$NOTIFY" || { echo "ERROR: daily reminder missing."; exit 1; }
          grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || { echo "ERROR: notification permission missing."; exit 1; }
          grep -q 'match /dailyPlans/{dateKey}' "$RULES" || { echo "ERROR: Firestore daily plan rules missing."; exit 1; }
          grep -q "request.resource.data.kind in \['TEXT', 'VOICE'\]" "$RULES" || { echo "ERROR: Firestore text/voice Chat rules missing."; exit 1; }
          grep -q 'allow delete: if isPairMember(pairId);' "$RULES" || { echo "ERROR: shared Chat curation rule missing."; exit 1; }

          # No placeholder regressions.
          if grep -RInE 'DemoData|FakeWave|PartnerVoiceBubble|preview-pair|BERA01' "$PROJECT_DIR/app/src/main/java"; then
            echo "ERROR: placeholder/demo runtime code was reintroduced."
            exit 1
          fi
          if grep -RInE 'onClick\s*=\s*\{\s*\}' "$PROJECT_DIR/app/src/main/java"; then
            echo "ERROR: empty UI action found."
            exit 1
          fi
          grep -q '#000000' "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher_foreground.xml" || { echo "ERROR: black bt launcher foreground missing."; exit 1; }
          echo "R11 guided runtime safeguards verified."

      - name: Verify update signing certificate
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          STORE_PASS="$(grep '^storePassword=' "$PROJECT_DIR/signing/keystore.properties" | cut -d= -f2-)"
          ALIAS="$(grep '^keyAlias=' "$PROJECT_DIR/signing/keystore.properties" | cut -d= -f2-)"
          keytool -list -v -keystore "$PROJECT_DIR/signing/beratalk-release.jks" -storepass "$STORE_PASS" -alias "$ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Build signed BeraTalk release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleRelease

      - name: Verify and stage signed APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          [[ -n "${APK:-}" && -f "$APK" ]] || { echo "ERROR: release APK missing."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="$RUNNER_TEMP/BeraTalk-1.4.0-guided-signed.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload signed BeraTalk APK
        uses: actions/upload-artifact@v4
        with:
          name: BeraTalk-1.4.0-guided-signed
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
